<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ChatLedger{% endblock %}</title>
<style>
:root{--bg:#eef2f1;--surface:#fff;--ink:#16282c;--muted:#5b6f72;--line:#cbd6d4;--accent:#0f5c63;--accent-ink:#fff;
--warn-bg:#fff1d0;--warn:#8a5700;--bad-bg:#fbe3df;--bad:#a5372b;--ok-bg:#dcf0e6;--ok:#1d6b45;}
@media (prefers-color-scheme:dark){:root{--bg:#101a1c;--surface:#172528;--ink:#e6efee;--muted:#93a9ac;--line:#2c4044;--accent:#5fc0c8;--accent-ink:#0c1a1c;
--warn-bg:#3a2d10;--warn:#f0c46a;--bad-bg:#3d1d19;--bad:#f2a398;--ok-bg:#12301f;--ok:#85d3a8;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header.top{background:var(--surface);border-bottom:2px solid var(--ink)}
.bar{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.brand{font-family:Georgia,"Iowan Old Style",serif;font-size:1.35rem;font-weight:700;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav a{padding:6px 12px;text-decoration:none;color:var(--ink);border-radius:6px}
nav a[aria-current=page]{background:var(--ink);color:var(--bg)}
nav a:hover{background:var(--line)}
nav a[aria-current=page]:hover{background:var(--ink)}
main{max-width:1080px;margin:0 auto;padding:24px 20px 60px}
h1{font-family:Georgia,"Iowan Old Style",serif;font-size:1.8rem;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:1.1rem;margin:28px 0 8px}
.sub{color:var(--muted);margin:0 0 20px}
.totals{display:flex;gap:28px;flex-wrap:wrap;margin:0 0 18px}
.totals div{min-width:120px}
.totals b{display:block;font-family:Georgia,serif;font-size:1.6rem;font-variant-numeric:tabular-nums}
.totals span{color:var(--muted);font-size:.9rem}
form.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:0 0 16px}
label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:3px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.filters select{width:auto;min-width:150px}
button,.btn{font:inherit;cursor:pointer;border-radius:6px;padding:8px 14px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);text-decoration:none;display:inline-block}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.small{padding:3px 9px;font-size:.85rem}
button.danger{color:var(--bad);border-color:var(--bad)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;font-size:.9rem;color:var(--muted);border-bottom:2px solid var(--ink);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.rejected td{color:var(--muted);text-decoration:line-through}
tr.rejected td.actions,tr.rejected td.st{text-decoration:none}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.82rem;border:1px solid var(--line)}
.pill.approved{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.rejected{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.pending{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.flag{display:block;margin-top:4px;padding:2px 8px;border-left:3px solid var(--warn);background:var(--warn-bg);color:var(--warn);font-size:.85rem;border-radius:0 4px 4px 0}
.flags-ok{color:var(--ok);font-size:.9rem}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.notice{padding:10px 14px;border-radius:6px;margin:0 0 16px}
.notice.ok{background:var(--ok-bg);color:var(--ok)}
.notice.bad{background:var(--bad-bg);color:var(--bad)}
code.copy{display:block;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;word-break:break-all;font-size:.9rem;user-select:all}
.bar-track{height:10px;background:var(--bg);border:1px solid var(--line);border-radius:99px;overflow:hidden;min-width:120px}
.bar-fill{height:100%;background:var(--accent)}
.bar-fill.over{background:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline{display:inline}
@media (max-width:640px){main{padding:16px 14px 50px}.bar{gap:10px}}
@media (prefers-reduced-motion:no-preference){.notice{animation:fade .25s ease-out}@keyframes fade{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>
{% block body %}
<header class="top"><div class="bar">
<a class="brand" href="/">ChatLedger</a>
<nav aria-label="Main">
<a href="/" {% if active=='ledger' %}aria-current="page"{% endif %}>Ledger</a>
<a href="/expenses/new" {% if active=='new' %}aria-current="page"{% endif %}>Add expense</a>
<a href="/summary" {% if active=='summary' %}aria-current="page"{% endif %}>Monthly summary</a>
<a href="/settings" {% if active=='settings' %}aria-current="page"{% endif %}>Settings</a>
</nav>
<a href="/logout">Log out</a>
</div></header>
<main>{% block content %}{% endblock %}</main>
{% endblock %}
</body>
</html>
