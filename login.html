{% extends "base.html" %}
{% block title %}Log in · ChatLedger{% endblock %}
{% block body %}
<main style="max-width:420px;margin-top:8vh">
<h1>ChatLedger</h1>
<p class="sub">Your expense ledger. Claude reads the receipts, this app keeps the books.</p>
{% if error %}<div class="notice bad" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/login" class="card">
<label for="u">Username</label>
<input id="u" name="username" autocomplete="username" required autofocus>
<div style="height:12px"></div>
<label for="p">Password</label>
<input id="p" name="password" type="password" autocomplete="current-password" required>
<div style="height:16px"></div>
<button class="primary" type="submit">Log in</button>
</form>
</main>
{% endblock %}
